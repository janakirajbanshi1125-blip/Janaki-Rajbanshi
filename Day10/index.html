<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store API</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 20px;
        }

        h1{
            text-align: center;
        }

        #products{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card{
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .card img{
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .card h3{
            font-size: 16px;
        }

        .price{
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Fake Store Products</h1>

<div id="products"></div>

<script src="script.js"></script>

</body>
</html>
