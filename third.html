<!DOCTYPE html>
<html>
<head>
    <title>Flex Cards</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background-color:#f2f2f2;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            padding:30px;
        }

        .card{
            width:150px;
            height:150px;
            background-color:rgba(9, 9, 240, 0.819);
            border:2px solid black;
            border-radius:10px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            font-weight:bold;
        }

        .card:hover{
            background-color:lightblue;
            cursor:pointer;
        }
    </style>

</head>
<body>

    <h2 style="text-align:center;">Flexbox Cards</h2>

    <div class="container">

        <div class="card">1</div>

        <div class="card">2</div>

        <div class="card">3</div>

        <div class="card">4</div>

        <div class="card">5</div>

        <div class="card">6</div>

    </div>
    <footer>
        <p style="text-align:center; justify-content:center; align-items:center;">Made for the CSS class - Flexbox $ Grid practice</p>
    </footer>

</body>
</html>
