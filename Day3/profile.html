<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="pro.css">
</head>
<body id="top">

    <!-- Profile Card -->
    <div class="profile-card">

        <div class="image-box">
            <img src="images/profile.jpg">
            <span class="online"></span>
        </div>

        <h2>Jane Doe</h2>

        <h4>Frontend Developer</h4>

        <p>
            Hello! I am a passionate frontend developer who enjoys creating
            responsive and attractive websites using HTML, CSS, and JavaScript.
            I enjoy learning new technologies and improving my web development
            skills every day.
        </p>

    </div>

    <!-- Back to Top Button -->
    <a href="#top" class="top-btn">Top</a>

</body>
</html>
